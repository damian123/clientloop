services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: clientloop
      POSTGRES_PASSWORD: clientloop
      POSTGRES_DB: clientloop
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientloop -d clientloop"]
      interval: 5s
      timeout: 5s
      retries: 10
